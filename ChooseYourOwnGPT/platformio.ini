; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@51.3.3
board = esp32dev
framework = arduino
lib_deps = 
	adafruit/Adafruit NeoPixel@1.12.4  ; LED control library
	https://github.com/adafruit/Adafruit-Thermal-Printer-Library.git@1.4.1  ; Thermal printer support
	ayushsharma82/NetWizard@1.2.0  ; WiFi configuration portal
	ArduinoJson@7.3.1  ; JSON parsing (current major version)
	https://github.com/programming-electronics-academy/chatGPT-Arduino-library.git@0.1.0+sha.70cec94  ; OpenAI API interface
	; Note: Consider periodically checking for updates to these libraries
	; Run 'pio pkg update' to update to the latest compatible versions
monitor_speed = 115200